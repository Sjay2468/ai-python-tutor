name: python_tutor
description: AI-Powered Personalized Python Tutor — hybrid rule-based & GPT-4 mobile app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  dio: ^5.4.3+1

  # State management
  provider: ^6.1.2

  # Local storage (JWT token)
  shared_preferences: ^2.2.3

  # Syntax highlighting for code snippets
  flutter_highlight: ^0.7.0

  # Markdown rendering for lesson explanations
  flutter_markdown: ^0.7.7+1

  # Icons
  cupertino_icons: ^1.0.8

  # Progress indicators
  percent_indicator: ^4.2.3
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
